name: CI

on:
  push:
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      SDL_VIDEODRIVER: dummy

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        id: lint
        continue-on-error: true
        run: python -m flake8 .

      - name: Run pytest
        id: tests
        continue-on-error: true
        run: python -m pytest

      - name: Generate HTML reports
        id: reports
        if: ${{ always() }}
        run: |
          mkdir -p reports/pytest reports/flake8
          python -m pytest --html=reports/pytest/report.html --self-contained-html || true
          python -m flake8 . --format=html --htmldir=reports/flake8 || true

      - name: Upload reports artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: reports/
          if-no-files-found: error

      - name: Write job summary
        if: ${{ always() }}
        run: |
          {
            echo "## CI results"
            echo ""
            echo "- Python: 3.13"
            echo "- Lint: ${{ steps.lint.outcome }}"
            echo "- Tests: ${{ steps.tests.outcome }}"
            echo "- Reports step: ${{ steps.reports.outcome }}"
            echo "- Artifact: ci-reports"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if checks failed
        if: ${{ steps.lint.outcome != 'success' || steps.tests.outcome != 'success' }}
        run: exit 1
